<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quiz Buzzer</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f2f2f2;
        margin: 0;
        padding: 20px;
    }
    button {
        padding: 20px 40px;
        font-size: 28px;
        background: #0078D4;
        color: white;
        border: none;
        border-radius: 10px;
        margin-top: 20px;
    }
    #hostArea, #playerArea {
        margin-top: 40px;
    }
    #winner {
        font-size: 40px;
        margin-top: 40px;
        color: green;
    }
</style>
</head>

<body>

<h1>📱 Quiz Buzzer</h1>

<div id="hostArea">
    <h2>Host View</h2>
    <p>Players scan this QR code to join:</p>
    <img id="qr" width="200" />
    <p id="players"></p>
    <button onclick="resetBuzz()">Reset Round</button>
    <div id="winner"></div>
</div>

<hr>

<div id="playerArea">
    <h2>Player View</h2>
    <p>Your Name:</p>
    <input id="nameInput" type="text" placeholder="Enter name">
    <button onclick="joinGame()">Join Game</button>

    <div id="buzzArea" style="display:none;">
        <h2 id="playerName"></h2>
        <button onclick="buzz()">BUZZ!</button>
        <p id="buzzStatus"></p>
    </div>
</div>

<script>
let players = [];
let buzzed = false;
let winnerName = "";

document.getElementById("qr").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=LOCAL_TEST";

function joinGame() {
    const name = document.getElementById("nameInput").value.trim();
    if (!name) return;

    players.push(name);
    document.getElementById("players").innerText = "Players: " + players.join(", ");

    document.getElementById("playerName").innerText = name;
    document.getElementById("buzzArea").style.display = "block";
}

function buzz() {
    if (!buzzed) {
        buzzed = true;
        winnerName = document.getElementById("playerName").innerText;
        document.getElementById("winner").innerText = winnerName + " buzzed first!";
        document.getElementById("buzzStatus").innerText = "You buzzed!";
    } else {
        document.getElementById("buzzStatus").innerText = "Too late!";
    }
}

function resetBuzz() {
    buzzed = false;
    winnerName = "";
    document.getElementById("winner").innerText = "";
    document.getElementById("buzzStatus").innerText = "";
}
</script>

</body>
</html>
